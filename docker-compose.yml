services:
  codex-dev:
    image: ghcr.io/<github-username>/codex-dev:latest
    container_name: codex-dev
    hostname: codex-dev
    restart: unless-stopped
    ports:
      - "10022:22"
    volumes:
      - ./workspace:/workspace
      - ./home/coder:/home/coder
    environment:
      SSH_USER: coder
      SSH_PASSWORD: change-me
      SSH_PUBLIC_KEY: ""
      SSH_KEY_PASSPHRASE: ""
      GIT_USER_NAME: "Your Name"
      GIT_USER_EMAIL: "your@email.com"
      OPENAI_API_KEY: "xxx"
