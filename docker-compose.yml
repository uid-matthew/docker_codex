services:
  codex-dev:
    image: ghcr.io/<github-username>/codex-dev:latest
    container_name: codex-dev
    hostname: codex-dev
    restart: unless-stopped
    ports:
      - "10022:22"
    volumes:
      - ./workspace:/workspace
      - ./ssh:/home/coder/.ssh
    environment:
      SSH_USER: coder
      SSH_PASSWORD: change-me
      SSH_PUBLIC_KEY: ""
      SSH_KEY_PASSPHRASE: ""
      OPENAI_API_KEY: "xxx"
